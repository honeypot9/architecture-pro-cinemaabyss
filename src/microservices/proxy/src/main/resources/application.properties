spring.application.name=proxy

# Reactor Netty Configuration
reactor.netty.ioWorkerCount=4
reactor.netty.pool.maxConnections=1000
reactor.netty.http.client.maxConnections=1000
reactor.netty.http.client.connectTimeout=5000
reactor.netty.http.client.responseTimeout=30000

# Spring Cloud Gateway
spring.cloud.gateway.httpclient.connect-timeout=1000
spring.cloud.gateway.httpclient.response-timeout=30s
spring.cloud.gateway.httpclient.pool.max-connections=1000