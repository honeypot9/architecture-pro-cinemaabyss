apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: cinemaabyss-circuit-breaker
  namespace: cinemaabyss
spec:
  host: "*.cinemaabyss.svc.cluster.local"
  trafficPolicy:
    connectionPool:
      tcp:
        maxConnections: 100
        connectTimeout: 30ms
      http:
        http1MaxPendingRequests: 50
        maxRequestsPerConnection: 10
        maxRetries: 3
    outlierDetection:
      consecutive5xxErrors: 5
      interval: 30s
      baseEjectionTime: 30s
      maxEjectionPercent: 50
      minHealthPercent: 20
---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: cinemaabyss-retry-policy
  namespace: cinemaabyss
spec:
  hosts:
    - "*.cinemaabyss.svc.cluster.local"
  http:
    - match:
        - uri:
            prefix: "/"
      route:
        - destination:
            host: "*.cinemaabyss.svc.cluster.local"
      retries:
        attempts: 3
        perTryTimeout: 2s
        retryOn: gateway-error,connect-failure,refused-stream
      timeout: 10s